name: Criar vitrine no hero

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Alterar somente a area direita do hero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.logo-card{border:1px solid var(--line);background:linear-gradient(145deg,#0a0a0a,#141414);border-radius:28px;padding:16px;box-shadow:var(--shadow)}.hero-art{position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 18% 18%,rgba(255,36,63,.18),transparent 25%),radial-gradient(circle at 82% 24%,rgba(216,0,141,.18),transparent 24%),radial-gradient(circle at 50% 82%,rgba(255,255,255,.05),transparent 26%),linear-gradient(145deg,#0a0a0a,#121212)}.hero-art::before{content:"";position:absolute;inset:13%;border-radius:26px;border:1px solid rgba(255,255,255,.055)}.hero-art::after{content:"";position:absolute;left:10%;right:10%;bottom:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}.hero-art .orb{position:absolute;border-radius:999px;filter:blur(2px)}.hero-art .orb-1{width:155px;height:155px;left:-34px;top:34px;background:radial-gradient(circle,rgba(255,36,63,.30),rgba(255,36,63,0) 68%)}.hero-art .orb-2{width:180px;height:180px;right:-45px;top:62px;background:radial-gradient(circle,rgba(216,0,141,.28),rgba(216,0,141,0) 68%)}.hero-art .orb-3{width:230px;height:230px;left:50%;bottom:-108px;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,255,255,.075),rgba(255,255,255,0) 68%)}.hero-art .ring{position:absolute;inset:23% 19%;border-radius:30px;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.018)}.hero-art .spark{position:absolute;width:8px;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--red),var(--pink2));box-shadow:0 0 18px rgba(255,36,63,.38)}.hero-art .spark-1{left:26%;top:29%}.hero-art .spark-2{right:24%;top:36%}.hero-art .spark-3{left:51%;bottom:23%}'
          new_css = '.hero-showcase{position:relative;min-height:520px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:12px 6px 12px 18px;overflow:hidden}.hero-showcase::before{content:"";position:absolute;right:-30px;top:38px;width:260px;height:260px;border-radius:999px;background:radial-gradient(circle,rgba(216,0,141,.22),rgba(216,0,141,0) 68%);filter:blur(10px);pointer-events:none}.hero-showcase::after{content:"";position:absolute;left:-40px;bottom:10px;width:280px;height:280px;border-radius:999px;background:radial-gradient(circle,rgba(255,36,63,.18),rgba(255,36,63,0) 70%);filter:blur(12px);pointer-events:none}.hero-showcase-tagline{position:relative;z-index:1;margin:0 0 28px;font-size:clamp(20px,2.4vw,31px);line-height:1.16;font-weight:900;letter-spacing:-.8px;max-width:460px;color:#fff;text-wrap:balance}.hero-showcase-list{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px}.hero-showcase-item{display:block;font-size:clamp(34px,5.2vw,68px);line-height:.98;font-weight:850;letter-spacing:-1.7px;color:rgba(255,255,255,.98);text-shadow:0 0 22px rgba(255,255,255,.03)}.hero-showcase-item.soft{color:rgba(255,255,255,.88)}.hero-showcase-item.more{margin-top:8px;font-size:clamp(32px,4.7vw,60px);font-weight:950;background:linear-gradient(90deg,#ff4d67 0%,#ff2e62 40%,#ff58c2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px rgba(255,58,117,.18);filter:drop-shadow(0 0 10px rgba(216,0,141,.18))}'

          old_block = '<div class="logo-card"><div class="hero-art" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span><span class="ring"></span><span class="spark spark-1"></span><span class="spark spark-2"></span><span class="spark spark-3"></span></div></div>'
          new_block = '<div class="hero-showcase"><p class="hero-showcase-tagline">Tudo o que você quer assistir, em um só lugar.</p><div class="hero-showcase-list"><span class="hero-showcase-item">Filmes</span><span class="hero-showcase-item soft">Séries</span><span class="hero-showcase-item">Canais</span><span class="hero-showcase-item soft">Novelas</span><span class="hero-showcase-item">Futebol</span><span class="hero-showcase-item soft">Animes</span><span class="hero-showcase-item more">e muito mais!</span></div></div>'

          old_mobile = '.hero-grid{grid-template-columns:1fr}.logo-card{max-width:390px}.services{grid-template-columns:1fr}'
          new_mobile = '.hero-grid{grid-template-columns:1fr}.hero-showcase{min-height:auto;padding:8px 0 0}.services{grid-template-columns:1fr}'

          if old_css not in s:
              raise SystemExit('CSS antigo do hero nao encontrado')
          if old_block not in s:
              raise SystemExit('Bloco antigo do hero nao encontrado')
          if old_mobile not in s:
              raise SystemExit('Regra responsiva antiga nao encontrada')

          s = s.replace(old_css, new_css, 1)
          s = s.replace(old_block, new_block, 1)
          s = s.replace(old_mobile, new_mobile, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Salvar alteracao
        shell: bash
        run: |
          git config user.name "ZEUSVENDAS site bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Cria vitrine de entretenimento no hero"
          git push